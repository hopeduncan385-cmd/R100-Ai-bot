<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R100 AI Deriv Signal Bot</title>
<style>
body{font-family:Arial;background:#0b1020;color:#eef2ff;margin:0;padding:16px}.app{max-width:760px;margin:auto}
.card{background:#151c32;border-radius:16px;padding:16px;margin:12px 0}button,select{padding:12px;border-radius:10px;border:0;margin:5px;font-weight:bold}
button{background:#5eead4;color:#07111f}select{background:#222b47;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.metric{background:#202945;padding:12px;border-radius:12px}.metric b{display:block;font-size:20px;margin-top:4px}
.signal{font-size:25px;font-weight:800}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #303a58;text-align:left}
.muted{color:#aab4d0;font-size:13px}
</style></head>
<body><div class="app">
<div class="card"><h1>🤖 R100 AI Signal Bot</h1><div class="muted">Deriv Volatility 100 • Signal Only</div></div>
<div class="card"><select id="win"><option>100</option><option>500</option><option selected>1000</option></select>
<button onclick="connect()">CONNECT DERIV</button><b id="status">Starting…</b></div>
<div class="card"><div class="muted">AI-style statistical assessment</div><div id="signal" class="signal">WAIT</div><div id="reason" class="muted">Collecting ticks…</div></div>
<div class="grid"><div class="metric">Last digit<b id="last">—</b></div><div class="metric">Best digit<b id="best">—</b></div>
<div class="metric">Match probability<b id="match">—</b></div><div class="metric">Confidence<b id="conf">—</b></div></div>
<div class="card"><h3>Digit distribution</h3><table><thead><tr><th>Digit</th><th>Count</th><th>%</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="card muted">Historical statistics cannot guarantee the next digit. This app does not place trades.</div>
</div>
<script>
const URL="wss://api.derivws.com/trading/v1/options/ws/public",SYMBOL="R_100";let ws,ticks=[],pipSize=null;
function digit(q,p){let n=Number(q);if(Number.isFinite(n)&&Number.isInteger(p)&&p>=0&&p<=10)return Math.abs(Math.round(n*10**p))%10;let s=String(q),a=s.split(".")[1]||"";return Number(a?a.slice(-1):s.slice(-1))}
function add(q,p){if(p!=null)pipSize=p;ticks.push({q:Number(q),p:pipSize});if(ticks.length>1000)ticks=ticks.slice(-1000);render()}
function connect(){if(ws)try{ws.close()}catch(e){};document.getElementById("status").textContent="CONNECTING…";ws=new WebSocket(URL);
ws.onopen=()=>{document.getElementById("status").textContent="CONNECTED — loading R_100";ws.send(JSON.stringify({ticks_history:SYMBOL,end:"latest",count:1000,style:"ticks",req_id:1}));ws.send(JSON.stringify({ticks:SYMBOL,subscribe:1,req_id:2}))};
ws.onmessage=e=>{try{let x=JSON.parse(e.data);if(x.error){document.getElementById("status").textContent="ERROR: "+x.error.message;return}
if(x.history){ticks=[];let p=x.history.prices||[];pipSize=x.pip_size??pipSize;p.forEach(q=>ticks.push({q:Number(q),p:pipSize}));render()}
if(x.tick){add(x.tick.quote,x.tick.pip_size);document.getElementById("status").textContent="LIVE — R_100"}}catch(e){}};
ws.onerror=()=>document.getElementById("status").textContent="Connection error";ws.onclose=()=>document.getElementById("status").textContent="Disconnected"}
function render(){let n=Number(document.getElementById("win").value),a=ticks.slice(-n),c=Array(10).fill(0);a.forEach(x=>c[digit(x.q,x.p)]++);let total=a.length||1,b=0;for(let d=1;d<10;d++)if(c[d]>c[b])b=d;
let pct=c[b]/total*100,conf=Math.min(99,Math.max(0,(pct-10)*8));document.getElementById("last").textContent=a.length?digit(a.at(-1).q,a.at(-1).p):"—";document.getElementById("best").textContent=a.length?b:"—";document.getElementById("match").textContent=a.length?pct.toFixed(1)+"%":"—";document.getElementById("conf").textContent=a.length?Math.round(conf)+"%":"—";
let s="WAIT",r="No strong historical edge.";if(a.length>=1000&&pct>=13){s="CHECK MATCH "+b;r="Above the 10% baseline in the selected sample."}else if(a.length>=500&&pct>=12){s="WATCH MATCH "+b;r="Moderate edge; wait for confirmation."}else if(a.length>=500&&pct<=8){s="WATCH DIFFER "+b;r="Target is below baseline; not a prediction."}
document.getElementById("signal").textContent=s;document.getElementById("reason").textContent=r;document.getElementById("rows").innerHTML=c.map((v,d)=>"<tr><td>"+d+"</td><td>"+v+"</td><td>"+(v/total*100).toFixed(1)+"%</td></tr>").join("")}
document.getElementById("win").onchange=render;connect();
</script></body></html>
